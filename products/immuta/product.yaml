matrix_coverage:
  - asset: runtime-ai-data
    functions: [identify, protect, detect]
    maturity: primary
    note: Discovers and classifies sensitive data and applies attribute-based access controls, masking, and redaction in real time to the data that users and AI agents query, monitoring access for unusual activity.
    source: { url: https://www.immuta.com/platform/govern, tier: official, title: Immuta Govern, accessed: 2026-09-22, origin: agent, quote: "Access controls, masking, and redaction are applied in real time without delays, manual updates, or gaps in enforcement." }
  - asset: ai-agent-identities
    functions: [protect]
    maturity: secondary
    note: Vends short-lived, attribute-based database roles to AI agents so a prompt-injected agent stays bound to its permitted data, and access can be revoked instantly.
    source: { url: https://www.immuta.com/agentic-data-access/, tier: official, title: Immuta Agentic Data Access, accessed: 2026-06-09, origin: reviewed, quote: "Whether you add 1 agent or 100, they all automatically follow the same enterprise guardrails without a single additional database role being manually created." }
primary_cell: { asset: runtime-ai-data, function: protect }
