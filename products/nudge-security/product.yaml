last_reviewed: 2026-07-27
changelog:
  - date: 2026-07-27
    summary: Added to the catalog from the Nudge Security documentation. AI agent discovery is offered as a research preview per the vendor feature page.
  - date: 2026-07-27
    summary: Refined matrix coverage.
matrix_coverage:
  - asset: ai-workload-platforms
    functions: [identify]
    maturity: primary
    note: Builds a historical and continuous inventory of AI apps and the accounts behind them using email-based discovery, an identity provider integration, and a browser extension, covering tools adopted before deployment.
    source: { url: https://www.nudgesecurity.com/use-cases/ai-security, tier: official, title: Nudge Security AI security and governance use case, accessed: 2026-07-27, origin: agent, quote: "Nudge Security can discover: AI apps, user accounts, OAuth integrations between AI tools and other apps" }
  - asset: ai-agent-identities
    functions: [identify]
    maturity: secondary
    note: Discovers agents built on agentic platforms through connected apps and passive browser observation, then records each agent creator, platform, permissions, connected resources, approval status, and risk signals such as public exposure or departed creators. Offered as a research preview.
    source: { url: https://www.nudgesecurity.com/features/ai-agent-discovery, tier: official, title: Nudge Security AI agent discovery feature page, accessed: 2026-07-27, origin: agent, quote: "For every agent Nudge Security finds, you get who built it, which platform it runs on, when it was created, what it connects to, what permissions it holds" }
  - asset: runtime-ai-data
    functions: [detect, protect]
    maturity: primary
    note: Watches what employees send to AI tools through the browser extension, flagging file uploads, copy and paste of sensitive content, and API key exposure, and applies AI use policies in the browser while allowing risky app-to-AI data integrations to be revoked.
    source: { url: https://www.nudgesecurity.com/use-cases/ai-security, tier: official, title: Nudge Security AI security and governance use case, accessed: 2026-07-27, origin: agent, quote: "Monitor AI chatbot conversations for sensitive data" }
  - asset: ai-orchestration-tools
    functions: [identify, protect]
    maturity: adjacent
    note: Surfaces the integration paths that give AI tools access to business data, including OAuth grants, API connections, and MCP connections into critical SaaS apps, and lets an administrator revoke a risky grant so the connected tool loses access.
    source: { url: https://www.nudgesecurity.com/use-cases/ai-security, tier: official, title: Nudge Security AI security and governance use case, accessed: 2026-07-27, origin: agent, quote: "our API connections into your other critical SaaS apps discovers app-to-app integrations that allow AI tools access to your data, including MCP connections" }
primary_cell: { asset: ai-workload-platforms, function: identify }
