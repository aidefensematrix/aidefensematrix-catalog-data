    functions: [identify, protect]
    maturity: secondary
    note: Captures AI traffic at the network level without endpoint agents to reveal which AI services are in use, and enforces role- and group-based access policies controlling which models, tools, and data each user can reach.
    source: { url: https://www.f5.com/products/workforce-ai-security, tier: official, title: F5 Workforce AI Security, accessed: 2026-09-22, origin: agent, quote: "Enforce context-aware policies that route requests to approved enterprise models, block high-risk or prohibited services, and protect sensitive data before it reaches a model." }
