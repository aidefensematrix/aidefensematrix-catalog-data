    note: Inspects AI inputs and outputs in real time and redacts sensitive information before it reaches models, agents, or connected systems, then logs every interaction across public and private models to provide audit trails.
    source: { url: https://www.f5.com/products/workforce-ai-security, tier: official, title: F5 Workforce AI Security, accessed: 2026-09-22, origin: agent, quote: "It identifies and automatically redacts sensitive information like PII, financial data, or intellectual property based on predefined and custom policies." }
