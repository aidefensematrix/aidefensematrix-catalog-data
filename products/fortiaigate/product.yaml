    functions: [protect, detect]
    maturity: primary
    note: Guardrails inspect input to each LLM endpoint to detect prompt injection, jailbreaking, and excessive consumption, while a context-aware DLP engine in the critical path blocks PII and sensitive data leakage in both directions.
    source: { url: https://www.fortinet.com/products/fortiaigate, tier: official, title: FortiAIGate AI Security and Governance Gateway, accessed: 2026-10-26, origin: agent, quote: "When a request carries a prompt injection or attempts data exfiltration, FortiAIGate blocks the activity and logs the attempt." }
  - asset: ai-model
    functions: [protect]
    maturity: secondary
    note: Protects LLMs against prompt injection, data leakage, model poisoning, and excessive resource consumption.
    source: { url: https://www.fortinet.com/blog/security-operations/fortiaigate-optimizing-and-protecting-ai-workloads, tier: official, title: "FortiAIGate Optimizing and Protecting AI Workloads, Fortinet Blog", accessed: 2026-10-26, origin: agent, quote: "FortiAIGate safeguards LLMs from prompt injections, data leakage, model poisoning, excessive resource consumption, and other emerging AI-specific risks." }
