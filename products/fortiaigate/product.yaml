    note: Operates as a self-hosted AI gateway between applications, agents, models, and MCP tools, identifying users, AI services, and content and blocking requests or masking sensitive data.
    source: { url: https://www.fortinet.com/products/fortiaigate, tier: official, title: FortiAIGate AI Security and Governance Gateway, accessed: 2026-10-26, origin: agent, quote: "FortiGate sends the AI traffic it detects to FortiAIGate, which identifies the user, the AI service, and the content, then blocks the request or masks sensitive data." }
