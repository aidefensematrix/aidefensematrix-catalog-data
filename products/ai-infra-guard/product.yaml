matrix_coverage:
  - asset: ai-coding-orchestration-tools
    functions: [identify, detect]
    maturity: primary
    note: Scans MCP servers, agent skills, and agent workflows for security risks such as tool poisoning and code vulnerabilities, and identifies known CVEs in AI frameworks such as Ollama and ComfyUI.
    source: { url: https://tencent.github.io/AI-Infra-Guard/, tier: official, title: A.I.G (AI-Infra-Guard) documentation, accessed: 2026-10-26, origin: agent, quote: "MCP Scan: Utilizes AI Agents to intelligently identify security threats in MCP Servers, such as tool poisoning and code vulnerabilities, assisting MCP developers and app marketplaces in completing security certification before release." }
  - asset: ai-model
    functions: [detect]
    maturity: secondary
    note: Jailbreak evaluation tests model prompt-security robustness with multiple attack methods and cross-model comparison.
    source: { url: https://tencent.github.io/AI-Infra-Guard/, tier: official, title: A.I.G (AI-Infra-Guard) documentation, accessed: 2026-10-26, origin: agent, quote: "Jailbreak Evaluation: Employs high-quality and diverse evaluation datasets to automatically evaluate the overall security of different large language models when faced with malicious, adversarial, or deceptive prompt inputs." }
  - asset: ai-workload-platforms
    functions: [identify, detect]
    maturity: secondary
    note: Fingerprints the web services of AI frameworks and components such as Ollama and ComfyUI and flags known CVE vulnerabilities.
    source: { url: https://tencent.github.io/AI-Infra-Guard/, tier: official, title: A.I.G (AI-Infra-Guard) documentation, accessed: 2026-10-26, origin: agent, quote: "AI Infra Scan: Detects known CVE vulnerabilities in the web services of various frameworks and components (e.g., Ollama, ComfyUI) used in AI training, deployment, and application building, through precise fingerprinting." }
primary_cell: { asset: ai-coding-orchestration-tools, function: detect }
