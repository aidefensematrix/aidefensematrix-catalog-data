matrix_coverage:
  - asset: ai-traffic
    functions: [protect]
    maturity: primary
    note: Acts as a centralized control layer across LLM, MCP, A2A, and A2P interactions, enforcing Cedar-based access, safety, and compliance policies inline and generating audit-ready reports.
    source: { url: https://www.highflame.com/platform, tier: official, title: Highflame Agent Gateway, accessed: 2026-11-23, origin: agent, quote: "A verified identity and authorization core sends policy to the decision point of four enforcement lanes: model, MCP and agent-to-agent traffic through the Identity-Aware Agent Gateway, and endpoint activity on developer machines." }
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: primary
    note: Inline controls inspect prompts and responses and block malicious inputs such as prompt injection, and strip PII and secrets before they reach the model or any tool.
    source: { url: https://www.highflame.com/platform, tier: official, title: Highflame platform runtime controls, accessed: 2026-11-23, origin: agent, quote: "Highflame checks the export against the agent’s identity, task and permissions, blocks it, and records the decision for review." }
  - asset: ai-coding-orchestration-tools
    functions: [protect, detect]
    maturity: primary
    note: Enforces one Cedar policy across MCP, tool-gateway, and agent-to-agent traffic, and its signal engine flags tool-risk and MCP poisoning inline.
    source: { url: https://www.highflame.com/platform, tier: official, title: Platform The Agent Control Fabric Highflame, accessed: 2026-11-23, origin: agent, quote: "Enforcement where agents act Consistent policies across models, MCP tools, agent handoffs, and developer environments." }
  - asset: ai-agent-identities
    functions: [identify, protect, detect]
    maturity: primary
    note: Discovers agents across the environment and issues each a verifiable, scoped, just-in-time credential with cascade revocation, then risk-scores every agent identity and monitors for mission drift.
    source: { url: https://www.highflame.com/platform, tier: official, title: Highflame Agent Identity, accessed: 2026-11-23, origin: agent, quote: "Give each agent a verifiable identity, define what it’s allowed to do, and enforce security policies as it acts." }
primary_cell: { asset: ai-agent-identities, function: protect }
