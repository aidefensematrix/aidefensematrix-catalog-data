matrix_coverage:
  - asset: runtime-ai-data
    functions: [identify, protect, detect]
    maturity: primary
    note: Inspects employee prompts on the device via browser extension and desktop client, classifies the sensitive data they contain in under 200 ms, and, per configured policy, logs, warns, coaches, or blocks the sharing.
    source: { url: https://www.harmonic.security/, tier: official, title: Harmonic Security homepage, accessed: 2026-10-03, origin: agent, quote: "You can block in real time, warn the employee with context about why the action is risky, or log silently for security team review." }
  - asset: ai-coding-orchestration-tools
    functions: [identify, detect, protect]
    maturity: secondary
    note: Harmonic Command provides visibility into AI agents acting through MCP servers and applies inline interventions that coach the user or agent when sensitive data is about to leave the business, and lets security teams set what each agent may read, write, or act on across MCP servers.
    source: { url: https://www.harmonic.security/products/command, tier: official, title: Harmonic Command product page, accessed: 2026-10-03, origin: agent, quote: "Security teams can also set granular permissions on what agents are allowed to do across connected MCP servers, deciding which systems they can read, write to, and act on." }
  - asset: ai-traffic
    functions: [identify]
    maturity: primary
    note: Builds an inventory of the AI tools employees use across the organization from the browser extension and desktop client.
    source: { url: https://www.harmonic.security/, tier: official, title: Harmonic Security homepage, accessed: 2026-10-03, origin: agent, quote: "On day one you get a full inventory of AI tools in use across your organization." }
primary_cell: { asset: runtime-ai-data, function: protect }
