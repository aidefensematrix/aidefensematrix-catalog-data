matrix_coverage:
  - asset: ai-agent-identities
    functions: [identify]
    maturity: primary
    note: AISPM discovers agents across environments, evaluates configuration and permission risk, and enforces guardrails before agents run, with an inventory of ownership, permissions, and integrations.
    source: { url: https://zenity.io/platform/ai-security-posture-management, tier: official, title: Zenity AI security posture management, accessed: 2026-09-22, origin: agent, quote: "AISPM scans across SaaS platforms, custom frameworks, and endpoints to build a complete inventory of agents, including ones security never signed off on." }
  - asset: runtime-ai-data
    functions: [detect, protect]
    maturity: primary
    note: AIDR monitors step-level agent execution at runtime, detects direct and indirect prompt injection, and blocks sensitive data leakage through agent conversations, tool calls, and memory.
    source: { url: https://zenity.io/platform/ai-security-platform/aidr, tier: official, title: Zenity AI detection and response, accessed: 2026-09-22, origin: agent, quote: "AIDR detects direct and indirect prompt injection and blocks execution before the agent acts on them." }
  - asset: ai-coding-orchestration-tools
    functions: [protect, detect]
    maturity: secondary
    note: MCP security provides visibility into MCP connections, blocks unauthorized agent actions, and enforces security policies over MCP-enabled agents.
    source: { url: https://zenity.io/use-cases/risk-type/mcp, tier: official, title: Zenity MCP security use case, accessed: 2026-09-22, origin: agent, quote: "See every server and tool, enforce policy with real context, and block risky calls in real time, with nothing to change on the agent side." }
primary_cell: { asset: ai-agent-identities, function: identify }
