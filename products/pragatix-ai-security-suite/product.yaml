matrix_coverage:
  - asset: runtime-ai-data
    functions: [identify, protect, detect]
    maturity: primary
    note: Prompt Guardian is an in-line proxy over public and private AI services that inspects prompts and responses, classifies sensitive or regulated data, and applies risk-based policy per user, department, and data sensitivity. It also surfaces unsanctioned AI tool usage across the organization.
    source: { url: https://agatsoftware.com/security-page/ai-security-suite/prompt-guardian/, tier: official, title: Pragatix Prompt Guardian, accessed: 2026-09-22, origin: agent, quote: "Real-time AI proxy that inspects prompts and responses, detects sensitive data and enforces usage policies across public and private AI services." }
  - asset: ai-coding-orchestration-tools
    functions: [identify, detect, protect]
    maturity: primary
    note: Guardian Agent discovers AI agents across SaaS, homegrown, embedded, endpoint, and developer environments, maps them to their connected tools and systems, traces their decisions and data access, and blocks or requires approval for high-risk actions at runtime.
    source: { url: https://agatsoftware.com/security-page/ai-security-suite/guardian-agent/, tier: official, title: Pragatix Guardian Agent, accessed: 2026-09-22, origin: agent, quote: "Discover, monitor, and control AI agents, MCP tools, and system action in runtime across SaaS, homegrown, embedded, endpoint, and developer environments." }
  - asset: ai-agent-identities
    functions: [identify, protect, detect]
    maturity: secondary
    note: The MCP Gateway brokers agent identities and permissions, granting policy-based access only to approved tools, data, and systems, with just-in-time access and intent-based authorization. Agent ownership is inventoried centrally and agent tool use is tracked in audit trails.
    source: { url: https://agatsoftware.com/ai-security-overview/guardian-agent/, tier: official, title: Pragatix agent identity and access control, accessed: 2026-08-20, origin: agent, quote: "Broker agent identities and permissions through the MCP Gateway, allowing policy-based access only to approved tools, data, and systems." }
  - asset: ai-traffic
    functions: [protect, detect]
    maturity: secondary
    note: The AI Gateway concentrates AI API traffic through one access layer, applying policy over which services may be reached and by whom, managing provider credentials across hosted and local model services, and tracking consumption per user, team, project, and model.
    source: { url: https://agatsoftware.com/ai-security-overview/ai-gateway/, tier: official, title: Pragatix AI Gateway, accessed: 2026-08-20, origin: agent, quote: "Route all AI API calls through a single gateway to enforce governance and standardize access to external AI providers." }
  - asset: ai-model
    functions: [identify, detect, protect]
    maturity: secondary
    note: Model Guardian inventories internal, external, and open-source models, checks their provenance, licensing, and exposure, red teams them against jailbreak and misuse scenarios, and gates their use behind an approval workflow that records the supporting evidence.
    source: { url: https://agatsoftware.com/security-page/ai-security-suite/model-guardian/, tier: official, title: Pragatix Model Guardian, accessed: 2026-09-22, origin: agent, quote: "Risk Engine that evaluates AI models using source intelligence and static & dynamic red teaming for vulnerability assessments." }
primary_cell: { asset: ai-coding-orchestration-tools, function: protect }
