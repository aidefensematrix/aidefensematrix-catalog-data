    note: Provides the identity layer for agent products, with multi-tenant user onboarding, least-privilege authorization, and managed third-party OAuth tokens with token rotation, so agents act with scoped refreshable credentials.
    source: { url: https://agen.co/identity, tier: official, title: Agen.co identity foundation page, accessed: 2026-09-22, origin: agent, quote: "Each agent gets a first-class machine identity: client ID, rotating secrets, short-lived tokens. No standing credentials to steal." }
  - asset: ai-coding-orchestration-tools
    functions: [protect, detect]
    maturity: secondary
    note: The AgentLink companion product creates a hosted MCP server that translates SaaS APIs into MCP tools, enforces agent-specific guardrails on every action, and keeps audit trails plus analytics of agent tool usage and anomalies.
    source: { url: https://agen.co/identity, tier: official, title: Agen.co identity foundation page, accessed: 2026-09-22, origin: agent, quote: "Your APIs become governed MCP tools with policy, identity, and audit built in." }
