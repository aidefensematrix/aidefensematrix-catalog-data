matrix_coverage:
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: primary
    note: Armor sits inline with in-house LLM applications and allows, restricts, or blocks prompts and outputs that carry prompt injection, sensitive data, or policy violations. Guardia scans employee prompts and uploads to tools such as ChatGPT in the browser and blocks sensitive content.
    source: { url: https://www.langprotect.com/armor-for-ai-apps, tier: official, title: LangProtect Armor for AI apps, accessed: 2026-10-31, origin: agent, quote: "It enforces policy decisions on prompts, model outputs, and execution paths at runtime, before AI systems access internal data, tools, or downstream services." }
  - asset: ai-traffic
    functions: [identify, protect, detect]
    maturity: primary
    note: Vector routes agent MCP traffic through one gateway that allows only the servers and tools each policy permits, blocks the rest, and scans tool call content for sensitive data and injected instructions. Guardia adds visibility into unsanctioned AI tools and browser extensions used by employees.
    source: { url: https://www.langprotect.com/vector, tier: official, title: LangProtect Vector for agents and MCP, accessed: 2026-11-16, origin: agent, quote: "Vector allows only the servers and tools each policy permits, blocks the rest, and scans tool call content for sensitive data and injected instructions before it reaches the server." }
  - asset: ai-agent-identities
    functions: [identify, protect, detect]
    maturity: secondary
    note: Vector inventories AI agents and other non-human identities with their owners and usage, flags over-privileged and dormant access, and binds each agent runtime to its own API key and MCP access policy so actions outside that scope are blocked.
    source: { url: https://www.langprotect.com/vector, tier: official, title: LangProtect Vector for agents and MCP, accessed: 2026-11-16, origin: agent, quote: "It finds every AI agent and NHI across your stack, flags access with no owner or no use, and enforces policy on every MCP tool call through one gateway." }
primary_cell: { asset: runtime-ai-data, function: protect }
