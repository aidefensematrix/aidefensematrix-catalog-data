matrix_coverage:
  - asset: ai-workload-platforms
    functions: [identify, protect, detect]
    maturity: primary
    note: Runtime detection and response for AI threats identifies unsafe AI usage, detects suspicious activity, and stops malicious activity in cloud native AI workloads without code changes; AI-SPM configuration checks assess the posture of cloud-based AI services.
    source: { url: https://www.aquasec.com/news/full-lifecycle-security-for-ai-applications/, tier: official, title: Aqua Secure AI launch press release, accessed: 2026-09-22, origin: agent, quote: "From Prompt to Production: Runtime Protection for AI Workloads" }
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: secondary
    note: Prompt-level runtime protection detects prompt injection, jailbreaks, and risky model behavior, enforcing policy in real time and blocking post-compromise activity without additional agents, code changes, or SDKs.
    source: { url: https://www.aquasec.com/solutions/ai-application-security/, tier: official, title: Aqua AI application security solution page, accessed: 2026-11-02, origin: agent, quote: "Aqua evaluates supported prompts and responses for injection, jailbreak attempts, sensitive data exposure and model misuse, and blocks the interaction before it executes." }
  - asset: ai-model
    functions: [identify]
    maturity: secondary
    note: Discovers which AI models, platforms, and versions are running, where they are used, and whether usage aligns with policy, monitoring in real time at the application layer across SaaS, managed, and self-hosted AI workloads.
    source: { url: https://www.aquasec.com/solutions/ai-application-security/, tier: official, title: Aqua AI application security solution page, accessed: 2026-11-02, origin: agent, quote: "Aqua maps LLM use, model types, platforms and versions across environments and shows which applications communicate with which AI services." }
primary_cell: { asset: ai-workload-platforms, function: protect }
