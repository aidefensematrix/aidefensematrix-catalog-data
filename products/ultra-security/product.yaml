matrix_coverage:
  - asset: ai-traffic
    functions: [identify, protect, detect]
    maturity: primary
    note: Sits between agents and the connectors and tools they call, records each action in an audit trail, and applies per-agent governance rules down to individual tools before an action runs. Inventories agents and connectors and alerts on unusual access, data movement, or tool use.
    source: { url: https://docs.ultra.security/introduction, tier: official, title: Ultra documentation introduction, accessed: 2026-10-31, origin: agent, quote: "Ultra sits between your agents and the tools they call, so every action is recorded, checked against your policy, and routed to the right connector." }
  - asset: runtime-ai-data
    functions: [protect]
    maturity: secondary
    note: Pre-built guardrails on every action stop tool poisoning, prompt injection, credential exposure, and rug pulls, with custom guardrails on paid tiers.
    source: { url: https://ultra.security/, tier: official, title: Ultra Security homepage, accessed: 2026-10-31, origin: agent, quote: "Pre-built guardrails stop tool poisoning, prompt injection, credential exposure, and rug pulls on every action." }
  - asset: ai-coding-orchestration-tools
    functions: [identify, protect, detect]
    maturity: secondary
    note: Installs on developer and employee devices, including through MDM, discovers the agents and connectors in use there such as Claude and Cursor, denies chosen connectors, tools, or agents, and alerts on anomalous agent behavior.
    source: { url: https://ultra.security/, tier: official, title: Ultra Security homepage, accessed: 2026-10-31, origin: agent, quote: "Ultra finds every agent and connector in your environment, including those built into Claude, Cursor, and the other agents your team uses." }
primary_cell: { asset: ai-traffic, function: protect }
