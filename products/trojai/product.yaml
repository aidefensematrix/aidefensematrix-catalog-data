    note: TrojAI Detect runs continuous, agent-led red teaming against AI models and agents, simulating single-turn, multi-turn, and agentic attacks to find weaknesses such as prompt injection, data leakage, and PII exposure before deployment.
    source: { url: https://www.a10networks.com/products/trojai-by-a10/, tier: official, title: TrojAI by A10 Networks product page, accessed: 2026-09-22, origin: agent, quote: "Detect runs continuous, agent-led red teaming against your AI models and agents, simulating single-turn, multi-turn, and agentic attacks to uncover unsafe behavior before deployment, with findings mapped to OWASP, MITRE, and NIST frameworks." }
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: primary
    note: TrojAI Defend is a runtime AI firewall that monitors, alerts, blocks, redacts, and logs, filtering inputs and outputs to AI applications to stop prompt injection, sensitive information disclosure, and other adversarial attacks.
    source: { url: https://www.a10networks.com/products/trojai-by-a10/, tier: official, title: TrojAI by A10 Networks product page, accessed: 2026-09-22, origin: agent, quote: "Defend blocks prompt injection, jailbreaking, data leakage, and toxic content in real time, enforcing security policies across every AI agent and application in production, and streaming insights into your existing SIEM, SOAR, and ticketing platforms." }
  - asset: ai-coding-orchestration-tools
    functions: [protect, detect]
    maturity: primary
    note: TrojAI Defend for MCP applies MCP-specific policies that inspect, audit, and enforce security on MCP traffic in real time, blocking unregistered or rogue servers in agentic workflows.
    source: { url: https://www.a10networks.com/products/trojai-by-a10/, tier: official, title: TrojAI by A10 Networks product page, accessed: 2026-09-22, origin: agent, quote: "Discovers rogue or misconfigured MCP servers and tools, enforces policy on agent-to-model-to-server communications, and blocks malicious or suspicious MCP traffic in real time." }
