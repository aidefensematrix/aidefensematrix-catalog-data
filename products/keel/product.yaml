description:
  value: "Keel: Hosted authorization layer that checks each AI agent model call, MCP tool call, or payment against policy and budget before it runs and records the decision as verifiable evidence."
  source: { url: https://docs.keelapi.com, tier: official, title: Keel documentation, accessed: 2026-10-31, origin: agent }
deployment:
  value: [saas]
  source: { url: https://docs.keelapi.com/egress-controlled-deployments, tier: official, title: Keel egress-controlled deployments documentation, accessed: 2026-10-31, origin: agent }
