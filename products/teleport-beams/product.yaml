    note: Runs agent workloads in ephemeral micro-VMs with virtualized networking that controls egress, ingress, and DNS; captures protocol-level traffic and LLM traces and flags harmful agent behavior such as goal hijacking for review.
    source: { url: https://www.beams.run/, tier: official, title: Teleport Beams product page, accessed: 2026-10-05, origin: agent, quote: "Beams runs agentic workloads in ephemeral micro-VMs with virtualized networking and snapshots." }
  - asset: ai-agent-identities
    functions: [protect]
    maturity: primary
    note: Launches agents with delegated identity limited to a subset of the delegator roles, connects them to cloud infrastructure and inference endpoints without secrets or passwords, and routes agentic access requests through an LLM judge or human review.
    source: { url: https://www.beams.run/, tier: official, title: Teleport Beams product page, accessed: 2026-10-05, origin: agent, quote: "Users or agents launch tasks with delegated identity: a subset of their roles and a traceable link to the delegator." }
