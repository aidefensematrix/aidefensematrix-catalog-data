matrix_coverage:
  - asset: ai-coding-orchestration-tools
    functions: [protect, identify, detect]
    maturity: primary
    note: Blocks unapproved agent skills, plugins, and MCP servers, and routes coding agents through the Agent Guard local proxy so they reach only approved MCP servers. Also inventories the skills, MCP servers, and plugins on developer machines and scans skills and plugins for malicious instructions.
    source: { url: https://jfrog.com/ai-security/, tier: official, title: JFrog AI Security product page, accessed: 2026-11-05, origin: agent, quote: "It detects agent skills, plugins, MCP servers, and models, scans them for risk, and blocks anything you have not approved." }
  - asset: ai-model
    functions: [identify, protect]
    maturity: secondary
    note: Shadow AI detection keeps a per-organization inventory of AI models found in JFrog repositories, by project, repository, and path. Administrators can allow or block each model, and JFrog Curation enforces a block on later downloads. Scanning models for malicious code is a JFrog Xray capability.
    source: { url: https://docs.jfrog.com/ai-ml/docs/detect-shadow-ai, tier: official, title: JFrog Detect Shadow AI documentation, accessed: 2026-11-05, origin: agent, quote: "Block prevents the model from being downloaded or used going forward." }
