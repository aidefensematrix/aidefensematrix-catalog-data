    functions: [identify, protect]
    maturity: secondary
    note: Scope extends to the data side of the pipeline, covering exposure of training data alongside the models built from it.
    source: { url: https://cloudmatos.ai/solution/ai-spm/, tier: official, title: AI Security Posture Management (AI-SPM), accessed: 2026-09-03, origin: agent, quote: "Protect sensitive training data and operational models from compromise, ensuring seamless and secure AI adoption." }
  - asset: ai-workload-platforms
    functions: [identify, detect]
    maturity: secondary
    note: Checks the managed model services an application builds on for insecure configuration, and extends the same scanning to the infrastructure-as-code that provisions them.
    source: { url: https://cloudmatos.ai/solution/ai-spm/, tier: official, title: AI Security Posture Management (AI-SPM), accessed: 2026-09-03, origin: agent, quote: "Detect misconfigurations in tools like OpenAI and Amazon Bedrock, enforce best practices, and secure your pipeline with IaC scanning" }
