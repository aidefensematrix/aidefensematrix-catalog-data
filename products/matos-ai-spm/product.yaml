    maturity: primary
    note: Inventories the models and AI services running in a cloud estate without agents, flags risky configurations against policy, and maps the vulnerability and permission chains that lead to them. Runtime insight covers AI package usage, permissions, and threats against deployed models.
    source: { url: https://cloudmatos.ai/solution/ai-spm/, tier: official, title: AI Security Posture Management (AI-SPM), accessed: 2026-09-03, origin: agent, quote: "Matos AI SPM safeguards your AI pipelines, detects misconfigurations, and identifies attack vectors targeting your AI services." }
