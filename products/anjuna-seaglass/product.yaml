  - date: 2026-08-17
    summary: Extended matrix coverage with runtime AI data and AI agent identity rows.
matrix_coverage:
  - asset: ai-model
    functions: [protect]
    maturity: primary
    note: Runs proprietary models and the code around them inside hardware trusted execution environments, so model weights stay confidential and integrity-protected against the host, privileged administrators, and infrastructure operators.
    source: { url: https://www.anjuna.io/solution/secure-ai, tier: official, title: Anjuna Secure AI model protection, accessed: 2026-08-17, origin: agent, quote: "using trusted execution environments to provide hardware-level isolation, confidentiality, and integrity protection for sensitive data and ML models" }
  - asset: ai-workload-platforms
    functions: [protect]
    maturity: primary
    note: Packages AI workloads as confidential containers that run on Kubernetes, in major clouds, or on-premises with always-on in-use encryption and policy-based cryptographic attestation before secrets are released.
    source: { url: https://www.anjuna.io/product/seaglass, tier: official, title: Anjuna Seaglass confidential runtime, accessed: 2026-08-17, origin: agent, quote: "it protects sensitive data, code, and AI models from attacks, insider threats, privileged admins, and infrastructure operators in every state, including during active processing" }
  - asset: training-data
    functions: [protect]
    maturity: secondary
    note: Processes training datasets inside the trusted execution environment and in confidential clean rooms, so fine-tuning and model training run on data that is never exposed in the clear to the operator or to collaborating parties.
    source: { url: https://www.anjuna.io/solution/secure-ai, tier: official, title: Anjuna Secure AI training privacy, accessed: 2026-08-17, origin: agent, quote: "Enables AI training without compromising privacy by processing confidentially on encrypted data." }
  - asset: ai-orchestration-tools
    functions: [protect]
    maturity: secondary
    note: Isolates agent runtimes and MCP servers in trusted execution environments so only attested code executes, with agent credentials and working data kept encrypted from the underlying cloud operator.
    source: { url: https://www.anjuna.io/solution/agentic-ai, tier: official, title: Anjuna agentic AI security, accessed: 2026-08-17, origin: agent, quote: "Seaglass ensures agents and MCP servers run only trusted code inside TEEs, with data and credentials protected even from cloud admins." }
  - asset: runtime-ai-data
    functions: [protect]
    maturity: secondary
    note: Runs AI workloads under always-on encryption inside the enclave, so inference inputs and working data stay encrypted in memory while the model is serving and remain unreadable to the host and its operators.
    source: { url: https://www.anjuna.io/product/seaglass, tier: official, title: Anjuna Seaglass always-on encryption, accessed: 2026-08-17, origin: agent, quote: "running your workloads in a confidential environment with always-on encryption: in-use, at-rest, and in-transit" }
  - asset: ai-agent-identities
    functions: [protect]
    maturity: secondary
    note: Gives each agent workload a hardware-rooted attested identity and releases secrets and credentials to it only after attestation succeeds, so an agent proves what it is before it can reach data or tools.
    source: { url: https://www.anjuna.io/solution/agentic-ai, tier: official, title: Anjuna agentic AI identity attestation, accessed: 2026-08-17, origin: agent, quote: "Immutable identity: agents prove exactly what they are before access" }
primary_cell: { asset: ai-workload-platforms, function: protect }
