matrix_coverage:
  - asset: ai-coding-orchestration-tools
    functions: [identify, protect, detect]
    maturity: primary
    note: Native hooks and managed MCP proxies in Codex, Claude Code, Cursor, and other agents send each action to local policy that allows, blocks, or asks for approval. It inventories local plugins, skills, and MCP servers, exports an AI bill of materials, and reviews changed tools before launch.
    source: { url: https://github.com/hashgraph-online/hol-guard, tier: official, title: HOL Guard GitHub repository, accessed: 2026-10-31, origin: agent, quote: "HOL Guard reviews agent actions before they run: shell commands, file access, package installs, and MCP tool calls." }
  - asset: runtime-ai-data
    functions: [detect, protect]
    maturity: secondary
    note: Screens supported prompt and tool-result events for prompt injection and sensitive content and can pause or block the next supported action. The vendor states it is not a complete prompt-injection preventer.
    source: { url: https://github.com/hashgraph-online/hol-guard, tier: official, title: HOL Guard GitHub repository, accessed: 2026-10-31, origin: agent, quote: "Screens supported events for prompt injection and sensitive content." }
  - asset: ai-traffic
    functions: [protect]
    maturity: secondary
    note: Inspects MCP server configuration and reviews MCP tool calls through supported hooks and managed proxies before they run.
    source: { url: https://github.com/hashgraph-online/hol-guard, tier: official, title: HOL Guard GitHub repository, accessed: 2026-10-31, origin: agent, quote: "Inspects server configuration and reviews tool calls through supported hooks and managed proxies." }
