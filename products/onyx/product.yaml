matrix_coverage:
  - asset: ai-orchestration-tools
    functions: [govern, identify, protect, detect, respond]
    maturity: primary
    note: Discovers sanctioned and shadow AI agents, monitors activity with anomaly detection and session replay, lets teams author natural language policies mapped to frameworks such as the EU AI Act, enforces them by sanctioning tools and controlling MCP access, and remediates via the Guardian Agent.
    source: { url: https://onyx.security/platform, tier: official, title: Onyx platform page, accessed: 2026-07-30, origin: agent, quote: "Sanction approved tools and control MCP server access" }
  - asset: ai-gateways-routers
    functions: [protect, detect]
    maturity: secondary
    note: The Onyx AI Gateway and MCP Gateway centralize cross-provider model traffic and agent tool calls on an inline path, inspecting each request and enforcing tool-call policy, data-class controls, and agent behavior guardrails through alert, block, mask, steer, or ask modes.
    source: { url: https://onyx.security/platform/ai-orchestration, tier: official, title: Onyx AI orchestration page, accessed: 2026-07-30, origin: agent, quote: "inline prompt inspection, tool-call policy enforcement, data-class controls, and agent-behavior guardrails on every request" }
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: primary
    note: Provides visibility into every AI prompt and response across the stack and protects prompts, responses, and agent actions in real time against prompt injection, jailbreaks, data exfiltration, and adversarial manipulation.
    source: { url: https://onyx.security/platform, tier: official, title: Onyx platform page, accessed: 2026-06-10, origin: reviewed, quote: "Protect your AI systems and the data they touch from prompt injection, jailbreaks, data exfiltration, and adversarial manipulation in real time, without disrupting workflows." }
  - asset: ai-model
    functions: [identify, detect]
    maturity: secondary
    note: Detects shadow AI usage and unapproved model deployments, identifies supply chain risks in agents, MCP servers, models, and AI assets, and probes agents and models for vulnerabilities with automated red teaming.
    source: { url: https://onyx.security/platform, tier: official, title: Onyx platform page, accessed: 2026-07-30, origin: agent, quote: "Spot vulnerabilities in agents and models with automated red teaming" }
primary_cell: { asset: ai-orchestration-tools, function: protect }
