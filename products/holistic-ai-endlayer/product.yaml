matrix_coverage:
  - asset: ai-coding-orchestration-tools
    functions: [identify, detect, protect, govern]
    maturity: primary
    note: A device agent inventories AI apps, coding agents, and MCP servers, tracks which agents act unattended, blocks agent and MCP requests that break policy, and grades tools against versioned rules mapped to EU AI Act, ISO/IEC 42001, and NIST AI RMF clauses.
    source: { url: https://www.holisticai.com/endlayer, tier: official, title: Holistic AI Endlayer, accessed: 2026-11-23, origin: agent, quote: "Discover AI tools, agents, models and MCP connections." }
  - asset: runtime-ai-data
    functions: [protect, detect, govern]
    maturity: secondary
    note: Guardrails score prompts before they run and redact or block secrets and personal data on the way out. Govern artifact is the versioned rule on what may leave in a prompt, mapped to GDPR personal-data clauses.
    source: { url: https://www.holisticai.com/endlayer, tier: official, title: Holistic AI Endlayer, accessed: 2026-11-23, origin: agent, quote: "Sensitive data in a prompt ↓ Versioned company policy Allow Warn Redact Block" }
  - asset: ai-traffic
    functions: [identify, detect, protect, govern]
    maturity: secondary
    note: Maps the AI sites and MCP hosts each device reaches, watches agent-to-agent and agent-to-MCP calls on the machine, and blocks those that break policy. Govern artifact is the versioned rule on which MCP hosts an agent may reach.
    source: { url: https://www.endlayer.ai/solutions/shadow-ai, tier: official, title: EndLayer Shadow AI detection, accessed: 2026-11-23, origin: agent, quote: "They discover every AI tool, agent, model and MCP connection, show what each one reaches and costs, and enforce your policy as it happens, with a versioned evidence record for every decision." }
  - asset: ai-agent-identities
    functions: [identify, detect, protect]
    maturity: secondary
    note: Finds the account type, declared access, and API-key presence for each AI tool and MCP connection without exposing secret values, and enforces policy on supported interactions as they happen.
    source: { url: https://www.endlayer.ai/, tier: official, title: EndLayer Guardian Agents for AI, accessed: 2026-10-26, origin: agent, quote: "See account type, declared access and API-key presence without exposing secret values." }
  - asset: ai-model
    functions: [identify]
    maturity: adjacent
    note: Local models running on managed machines appear in the same device inventory as the other AI tools.
    source: { url: https://www.holisticai.com/endlayer, tier: official, title: Holistic AI Endlayer, accessed: 2026-11-23, origin: agent, quote: "Discover AI tools, agents, models and MCP connections." }
primary_cell: { asset: ai-coding-orchestration-tools, function: identify }
