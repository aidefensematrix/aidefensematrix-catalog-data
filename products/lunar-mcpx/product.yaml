    note: MCP gateway routes agent tool calls to MCP servers through one endpoint with per-agent access control, tool groups, hardened tool variants, and OAuth and API key auth; audit logs record tool usage and configuration changes.
    source: { url: https://help.boomi.com/docs/Atomsphere/AIGateway/MCPGateway/mcpx_overview, tier: official, title: MCP Gateway Boomi Documentation, accessed: 2026-09-22, origin: agent, quote: "MCP Gateway provides a single point of control with full visibility into all traffic and enforceable policies on how tools are accessed, configured, and used." }
