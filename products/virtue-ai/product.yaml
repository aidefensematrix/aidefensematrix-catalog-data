matrix_coverage:
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: primary
    note: VirtueGuard applies real-time multimodal guardrails that inspect prompts and responses and block harmful or out-of-policy content across text, image, audio, video, and code.
    source: { url: https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-advances-continuous-ai-protection-with-the-acquisition-of-virtue-ai, tier: official, title: Fortinet Advances Continuous AI Protection with the Acquisition of Virtue AI, accessed: 2026-10-26, origin: agent, quote: "Enforces customizable policies across text, images, video, audio, and AI-generated code to prevent harmful content, sensitive data, jailbreaks, and vulnerable code from reaching users or downstream systems." }
  - asset: ai-agent-identities
    functions: [protect, detect]
    maturity: primary
    note: AgentSuite-Blue judges every agent tool call and blocks unsafe or out-of-policy actions before they execute (ActionGuard), and scans MCP tools and source for injections and data-leakage paths (MCP Guard).
    source: { url: https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-advances-continuous-ai-protection-with-the-acquisition-of-virtue-ai, tier: official, title: Fortinet Advances Continuous AI Protection with the Acquisition of Virtue AI, accessed: 2026-10-26, origin: agent, quote: "Provides full visibility into agents and AI tools running in their environment, discovers unsanctioned AI applications and agents, scans MCP tools and source code for hidden risks, monitors agent behavior, and blocks malicious tool calls before they act." }
  - asset: ai-model
    functions: [detect]
    maturity: secondary
    note: VirtueRed runs continuous automated red-teaming against AI models and chatbots to surface vulnerabilities and produce audit-ready evidence.
    source: { url: https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-advances-continuous-ai-protection-with-the-acquisition-of-virtue-ai, tier: official, title: Fortinet Advances Continuous AI Protection with the Acquisition of Virtue AI, accessed: 2026-10-26, origin: agent, quote: "Identifies new risks across every model update and fine-tuning of policies, while generating audit-ready evidence to support security and compliance reviews." }
primary_cell: { asset: runtime-ai-data, function: protect }
