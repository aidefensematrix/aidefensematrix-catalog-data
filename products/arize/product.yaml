matrix_coverage:
  - asset: runtime-ai-data
    functions: [detect]
    maturity: primary
    note: Traces the guardrail checks an application runs on LLM inputs and outputs as their own span kind, so each check and its result is visible. Blocking stays with the application, and an AI provider integration can attach an Amazon Bedrock guardrail.
    source: { url: https://arize.com/docs/ax/security-and-settings/llm-security/guardrails, tier: official, title: Arize AX guardrails, accessed: 2026-11-16, origin: agent, quote: "When you trace an AI agent that uses guardrails, the guardrail steps appear as their own span kind, so each check is visible in the trace." }
  - asset: ai-coding-orchestration-tools
    functions: [detect]
    maturity: secondary
    note: Evaluations score LLM and agent application outputs in production to flag hallucinations, low quality, and unsafe responses.
    source: { url: https://arize.com/llm-evaluation/production-llm-evaluation/, tier: official, title: Arize production LLM evaluation, accessed: 2026-06-09, origin: reviewed, quote: "LLM guardrails work in real-time to either catch dangerous user inputs or screen model outputs." }
primary_cell: { asset: runtime-ai-data, function: detect }
