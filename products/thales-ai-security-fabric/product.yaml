matrix_coverage:
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: primary
    note: Inspects traffic to and from applications built on LLMs at runtime, stopping prompt injection and jailbreak attempts, system prompt leakage, and disclosure of sensitive information, and applying content moderation to responses.
    source: { url: https://cpl.thalesgroup.com/about-us/newsroom/thales-launches-ai-security-fabric, tier: official, title: Thales Launches AI Security Fabric, accessed: 2026-07-29, origin: agent, quote: "Providing real-time protection for AI-specific threats, including prompt injection, jailbreaking, system prompt leakage, model denial-of-service attacks, sensitive information leakage, and content moderation." }
  - asset: training-data
    functions: [identify, protect]
    maturity: secondary
    note: Finds sensitive structured and unstructured enterprise data and applies encryption and key management to it before that data is ingested into retrieval-augmented generation pipelines.
    source: { url: https://cpl.thalesgroup.com/about-us/newsroom/thales-launches-ai-security-fabric, tier: official, title: Thales Launches AI Security Fabric, accessed: 2026-07-29, origin: agent, quote: "discover and secure sensitive structured and unstructured enterprise data before it is ingested into retrieval-augmented applications" }
  - asset: ai-model
    functions: [protect]
    maturity: secondary
    note: Runtime controls are aimed at model-layer abuse as well as application-layer abuse, covering data poisoning and model manipulation alongside denial-of-service attacks directed at the model.
    source: { url: https://cpl.thalesgroup.com/data-security/ai-cybersecurity-solutions, tier: official, title: Thales AI Security Fabric product page, accessed: 2026-07-29, origin: agent, quote: "From reducing the risk of data poisoning and model manipulation" }
primary_cell: { asset: runtime-ai-data, function: protect }
