matrix_coverage:
  - asset: ai-coding-orchestration-tools
    functions: [protect, detect]
    maturity: primary
    note: A user-space proxy scoped to coding agent processes blocks outbound calls by default, allows listed destinations, routes risky actions to a human approver, checks the intent behind each call, and monitors session behavior for prompt injection and drift, logging every decision to the SIEM.
    source: { url: https://www.permit.io/coding-agents-gateway, tier: official, title: Permit Coding Agents Gateway product page, accessed: 2026-11-19, origin: agent, quote: "Every call from Cursor, Claude Code, and Codex has its intent interrogated and is decided by policy." }
  - asset: ai-agent-identities
    functions: [protect, detect]
    maturity: secondary
    note: Provisions each coding agent identity through the customer IGA and expresses its permissions as relationships to the human who delegated the work, enforcing least privilege on agent actions; guardian agents monitor each session for escalation and drift after access is granted.
    source: { url: https://www.permit.io/coding-agents-gateway, tier: official, title: Permit Coding Agents Gateway product page, accessed: 2026-11-19, origin: agent, quote: "Agent identities provisioned and governed through your existing IGA" }
primary_cell: { asset: ai-coding-orchestration-tools, function: protect }
