matrix_coverage:
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: primary
    note: Inspects prompts, responses, tool calls, and files inline with classifiers for prompt injection, jailbreaks, malicious URLs, and data leakage, applies DLP and PII redaction, blocks threats, and surfaces risky sessions across the organization.
    source: { url: https://www.island.io/ai, tier: official, title: Island Enterprise AI page, accessed: 2026-10-03, origin: agent, quote: "Inspects every prompt, tool call, and file, blocks threats inline, and tells the agent or the user why so it corrects course instead of just failing." }
  - asset: ai-coding-orchestration-tools
    functions: [identify, protect, detect]
    maturity: secondary
    note: Discovers MCP servers, skills, and extensions running on endpoints, including those used by coding agents, flags compromised MCP servers and skills with threat intelligence, and removes risky components.
    source: { url: https://www.island.io/ai, tier: official, title: Island Enterprise AI page, accessed: 2026-10-03, origin: agent, quote: "Discovers every MCP server, skill, and extension running on the endpoint, and removes the ones flagged as risky." }
  - asset: ai-agent-identities
    functions: [identify, protect, detect]
    maturity: secondary
    note: Inventories the non-human identities agents run as, maps them to users, sessions, and access paths, analyzes their activity to surface risk, and issues task-scoped just-in-time credentials with per-tool read, write, or execute limits.
    source: { url: https://www.island.io/ai, tier: official, title: Island Enterprise AI page, accessed: 2026-10-03, origin: agent, quote: "Inventories every non-human identity in use, analyzes its risk, and issues just-in-time access instead of standing credentials." }
  - asset: ai-traffic
    functions: [protect, detect]
    maturity: secondary
    note: An MCP gateway sits between agents and the tools they call, applying identity, per-source policy, and audit to each call and inspecting or blocking malicious tool calls during a live session.
    source: { url: https://www.island.io/blog/expanding-island-to-govern-your-ai-workforce, tier: official, title: Island blog on governing the AI workforce, accessed: 2026-10-03, origin: agent, quote: "Our MCP Gateway sits inline on live calls and can inspect or block a malicious tool call mid session." }
  - asset: ai-model
    functions: [identify]
    maturity: adjacent
    note: Records the models in use alongside the agents, MCP servers, and skills in the AI inventory.
    source: { url: https://www.island.io/ai, tier: official, title: Island Enterprise AI page, accessed: 2026-10-03, origin: agent, quote: "Inventory MCP servers, coding agents, skills, and models with risk-scores" }
primary_cell: { asset: runtime-ai-data, function: protect }
