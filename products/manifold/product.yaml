    functions: [identify, detect, respond]
    maturity: primary
    note: Treats each agent as a principal, mapping the access it has accumulated and the delegation chains it acts through, then flags and contains agents whose behavior departs from that baseline.
    source: { url: https://www.manifold.security/, tier: official, title: Manifold, accessed: 2026-07-28, origin: reviewed, quote: "Manifold surfaces the privilege paths, delegation chains, and capability combinations that create real exposure." }
