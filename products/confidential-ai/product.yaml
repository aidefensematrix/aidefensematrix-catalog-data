matrix_coverage:
  - asset: runtime-ai-data
    functions: [protect]
    maturity: primary
    note: Private inference keeps prompts, responses, and model interactions encrypted in use inside TEEs.
    source: { url: https://confidential.ai/pricing, tier: official, title: Confidential AI pricing, accessed: 2026-09-22, origin: agent, quote: "Prompts and responses stay invisible to us, with an attestation on every response." }
  - asset: ai-model
    functions: [protect]
    maturity: secondary
    note: Proprietary model weights stay inside hardware-encrypted enclaves during inference, training, and fine-tuning, with attested builds and client-verifiable confidentiality claims.
    source: { url: https://confidential.ai/blog/c8s-launch, tier: official, title: C8s Kubernetes Made Confidential, accessed: 2026-09-22, origin: agent, quote: "Sensitive artifacts like model weights stay encrypted at rest and only decrypt inside a pod that proves what it is." }
  - asset: ai-workload-platforms
    functions: [protect]
    maturity: secondary
    note: Runs AI workloads (inference, agents, training) in TEEs via confidential VMs and the c8s Confidential Kubernetes platform.
    source: { url: https://confidential.ai/docs/c8s, tier: official, title: Confidential AI c8s Confidential Kubernetes docs, accessed: 2026-09-22, origin: agent, quote: "workloads run in hardware-encrypted memory the host cannot read." }
  - asset: training-data
    functions: [protect]
    maturity: secondary
    note: Private training runs on customer or proprietary data inside TEEs, so developers, administrators, and the cloud provider cannot see the runtime data.
    source: { url: https://confidential.ai/blog/c8s-ga, tier: official, title: c8s Is Now Generally Available, accessed: 2026-09-22, origin: agent, quote: "c8s allows you to run workloads such as inference, training, or processing of customer or proprietary data privately, such that your dev team, your system administrators, and your cloud provider cannot see any of the runtime data." }
primary_cell: { asset: runtime-ai-data, function: protect }
