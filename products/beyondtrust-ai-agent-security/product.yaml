  - asset: ai-traffic
    functions: [identify, protect]
    maturity: secondary
    note: Discovery covers the LLM endpoints each agent calls, and MCP and network controls run on the endpoint itself, so they apply whether or not the agent routes through a gateway.
    source: { url: https://docs.beyondtrust.com/bt-docs/docs/ai-agent-security, tier: official, title: BeyondTrust AI Agent Security documentation, accessed: 2026-10-31, origin: agent, quote: "Because control is applied on the endpoint, MCP and network controls do not depend on the agent being routed through a particular ecosystem." }
