    note: An endpoint agent on Windows and macOS discovers AI coding agents, desktop AI apps, their MCP servers, LLM endpoints, and skills. Policy allows, audits, holds for approval, or blocks each action before it runs, and AI sessions record prompts, commands, files, and findings by severity.
