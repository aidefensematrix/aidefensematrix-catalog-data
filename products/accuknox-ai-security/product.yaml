changelog:
  - date: 2026-09-23
    summary: Added at the request of a contributor affiliated with AccuKnox, from the AccuKnox product pages and help documentation.
matrix_coverage:
  - asset: ai-workload-platforms
    functions: [identify, protect, detect, respond]
    maturity: primary
    note: AI-SPM connects agentlessly to AWS, Azure, and GCP and inventories models, datasets, and compute in Bedrock, SageMaker, Vertex AI, and Azure AI. AI-DR watches control-plane logs and auto-remediates exposed endpoints. An eBPF and LSM sandbox confines inference workloads.
    source: { url: https://accuknox.com/platform/ai-security, tier: official, title: AccuKnox AI Security platform page, accessed: 2026-09-23, origin: agent, quote: "Builds a live, agentless inventory of every model, agent, dataset, and pipeline, spanning cloud and on-prem, in one dashboard." }
  - asset: ai-coding-orchestration-tools
    functions: [identify, protect, detect]
    maturity: primary
    note: Discovers agents on Azure AI Foundry, Copilot Studio, and AWS Bedrock, confines agent processes, files, and network at the kernel with eBPF, enforces per-agent tool access, budgets, and egress allowlists, and audits agent behavior at runtime.
    source: { url: https://accuknox.com/solutions/agentic-ai-security, tier: official, title: AccuKnox Agentic AI Security, accessed: 2026-09-23, origin: agent, quote: "Enforce least-privilege at every agent step. Kernel-level sandboxing via eBPF." }
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: primary
    note: Inspects each prompt and response against per-application policies for prompt injection, jailbreaks, PII, secrets, and toxicity, then blocks, masks, or logs it. The engine is stateful, so it scores the whole conversation and catches a jailbreak spread across many turns.
    source: { url: https://help.accuknox.com/use-cases/prompt-firewall-overview/, tier: official, title: AccuKnox Prompt Firewall documentation, accessed: 2026-09-23, origin: agent, quote: "AccuKnox Prompt Firewall is a real-time inline security layer that sits between your users and your LLM." }
  - asset: ai-model
    functions: [identify, detect]
    maturity: primary
    note: Lists models in the live AI asset inventory. Scans five model formats for tampering and deserialization attacks and flags integrity violations in Hugging Face or GitHub models before deployment. Runs 150+ adversarial probes on each model change.
    source: { url: https://accuknox.com/platform/ai-security, tier: official, title: AccuKnox AI Security platform page, accessed: 2026-09-23, origin: agent, quote: "Scans all 5 major model formats for supply-chain tampering and deserialization attacks." }
  - asset: training-data
    functions: [identify, detect]
    maturity: secondary
    note: Lists datasets in the live AI asset inventory and scans training datasets for PII and PHI.
    source: { url: https://accuknox.com/platform/ai-security, tier: official, title: AccuKnox AI Security platform page, accessed: 2026-09-23, origin: agent, quote: "Scans training datasets for PII/PHI before it becomes a compliance incident." }
  - asset: ai-traffic
    functions: [protect]
    maturity: secondary
    note: The Prompt Firewall enforces policy on LLM traffic at AI gateways, alongside response filtering and usage monitoring.
    source: { url: https://accuknox.com/platform/ai-security, tier: official, title: AccuKnox AI Security platform page, accessed: 2026-09-23, origin: agent, quote: "Prompt Firewall, AI Gateway Enforcement, Response Filtering, Policy Analytics, and usage monitoring." }
  - asset: ai-generated-code
    functions: [protect]
    maturity: secondary
    note: Runs scripts and code that an LLM generates in a sandbox that isolates their execution to prevent malicious runtime behavior.
    source: { url: https://accuknox.com/solutions/agentic-ai-security, tier: official, title: AccuKnox Agentic AI Security, accessed: 2026-09-23, origin: agent, quote: "Isolates LLM-generated scripts and code execution to prevent malicious runtime behavior." }
primary_cell: { asset: ai-workload-platforms, function: identify }
