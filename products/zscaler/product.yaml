  - asset: ai-traffic
    functions: [identify]
    maturity: primary
    note: Discovers which AI apps are in use across the organization and which users access them.
    source: { url: https://www.zscaler.com/products-and-solutions/ai-access-security, tier: official, title: Zscaler AI access security, accessed: 2026-10-03, origin: agent, quote: "Discover which AI apps are being used and by which users." }
