matrix_coverage:
  - asset: ai-workload-platforms
    functions: [identify]
    maturity: primary
    note: Discovers how employees and agents interact with AI platforms such as ChatGPT Enterprise and Microsoft Copilot, finds unsafe platform settings and third-party integrations, and enforces AI acceptable use policies.
    source: { url: https://www.tenable.com/products/ai-exposure, tier: official, title: Tenable AI Exposure product page, accessed: 2026-06-10, origin: reviewed, quote: "It delivers visibility, context, and control to manage AI risk from enterprise AI platforms, so you can govern AI use, enforce policies, and prevent exposures." }
  - asset: runtime-ai-data
    functions: [detect, identify]
    maturity: primary
    note: The Explorer page inspects messages in user AI sessions to identify potential data exfiltration or sharing of sensitive information with AI models; the Issues page surfaces detected policy breaches and security gaps.
    source: { url: https://www.tenable.com/blog/tenable-one-ai-exposure-secure-ai-usage-at-scale, tier: official, title: "Introducing Tenable One AI Exposure, A New Standard for Securing AI Usage at Scale", accessed: 2026-09-22, origin: agent, quote: "Teams can identify sensitive data shared through prompts or uploads, enforce AI acceptable use policies, and apply guardrails that guide users toward safer AI behavior." }
  - asset: ai-agent-identities
    functions: [identify]
    maturity: secondary
    note: The Inventory page tracks users, deployed AI agents, and AI memories; AI agent assets carry risk scores in Tenable Exposure Management.
    source: { url: https://www.tenable.com/blog/tenable-one-ai-exposure-secure-ai-usage-at-scale, tier: official, title: "Introducing Tenable One AI Exposure, A New Standard for Securing AI Usage at Scale", accessed: 2026-09-22, origin: agent, quote: "It also surfaces excessive permissions and identity weaknesses tied to AI services and agents, enabling teams to enforce least-privilege access and reduce attack paths that put critical AI resources at risk." }
