  - date: 2026-11-07
    summary: Changed the vendor from Bosch to AIShield after its December 2025 spin-off, recorded the Protectt.ai majority stake announced 2026-10-27, renamed Guardian to AIGuardian, removed protect from the AI Model row, and re-sourced the entry to aishield.security.
matrix_coverage:
  - asset: ai-model
    functions: [identify, detect]
    maturity: primary
    note: AISpectra Model Scanner discovers models and notebooks in repositories such as GitHub, Hugging Face, and AWS S3 and scans them for serialization attacks, malicious code, and hardcoded secrets; AISpectra Red Teaming runs automated attack simulations against LLMs and AI apps before deployment.
    source: { url: https://aishield.security/aispectra-model-scanner/, tier: official, title: AISpectra Model Scanner, accessed: 2026-11-07, origin: agent, quote: "Identifies issues such as hardcoded secrets, model serialization attacks, and unsafe operations." }
  - asset: runtime-ai-data
    functions: [protect, detect]
    maturity: primary
    note: AIGuardian AI Firewall screens LLM and agent traffic in real time, blocking prompt injection, filtering toxic content, and redacting sensitive information, with audit and block modes and monitoring of API interactions.
    source: { url: https://aishield.security/aiguardian-ai-firewall/, tier: official, title: AIGuardian AI Firewall, accessed: 2026-11-07, origin: agent, quote: "Guardian combines dynamic content policies, privacy controls, and advanced threat detection to protect LLMs and AI agents in real time." }
primary_cell: { asset: ai-model, function: detect }
