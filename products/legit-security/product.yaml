matrix_coverage:
  - asset: ai-model
    functions: [identify]
    maturity: primary
    note: The AI Security Command Center keeps a real-time inventory of AI models active across development, adds reputational data for each model, and flags low-reputation or unapproved models even when developers attempt to bypass security controls.
    source: { url: https://www.legitsecurity.com/press-releases/legit-security-unveils-upgraded-ai-security-command-center-to-tackle-ai-code-risks, tier: official, title: Legit Security Unveils Upgraded AI Security Command Center, accessed: 2026-10-26, origin: agent, quote: "Users instantly see the AI models and MCP servers in their engineering environments, along with areas of risk that must be remediated." }
  - asset: ai-coding-orchestration-tools
    functions: [identify]
    maturity: secondary
    note: Inventories MCP servers and AI coding assistants alongside models, surfacing shadow MCP servers that create unmonitored pathways for data exposure and unauthorized AI agent actions, with associated risks tracked per component.
    source: { url: https://www.legitsecurity.com/platform/ai-coding, tier: official, title: Legit VibeGuard Secure AI Coding, accessed: 2026-10-26, origin: agent, quote: "It auto-discovers every agent and plugin running in the environment, with no manual setup per tool, and engages developers in the moment instead of just blocking them." }
  - asset: ai-generated-code
    functions: [protect, detect]
    maturity: primary
    note: VibeGuard integrates with AI IDEs and code assistants such as Cursor and GitHub Copilot, analyzes AI-generated code in real time before commit, restricts which files assistants can access, and blocks untrusted models and secrets exposure to AI systems.
    source: { url: https://www.legitsecurity.com/platform/ai-coding, tier: official, title: Legit VibeGuard Secure AI Coding, accessed: 2026-10-26, origin: agent, quote: "VibeGuard secures AI code at the developer endpoint, the moment code is created, enforcing policy in real time and guiding developers instead of blocking them." }
